<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IWLIME 2018 Gallery</title>
  <style>
    :root {
      --primary-teal: #086972;
      --bg-teal: #044b52;
      --nav-btn-bg: #032b30;
      --text-white: #ffffff;
    }
    body {
      background-color: var(--bg-teal);
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: var(--text-white);
    }
    .gallery-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 3rem 2rem;
    }
    
    /* Navigation Bar matching screenshot */
    .nav-bar {
      display: flex;
      justify-content: center;
      gap: 1.5rem;
      margin-top: 4rem;
      flex-wrap: wrap;
    }
    .nav-btn {
      background-color: var(--nav-btn-bg);
      color: var(--text-white);
      text-decoration: none;
      padding: 1.5rem 3rem;
      font-size: 1.1rem;
      font-weight: 700;
      text-transform: uppercase;
      box-shadow: 0 15px 25px -5px rgba(0,0,0,0.9);
      border: none;
      transition: transform 0.2s, background-color 0.2s;
    }
    .nav-btn:hover {
      background-color: #043f47;
      transform: translateY(-2px);
    }
    
    /* Title */
    .gallery-title {
      font-size: 2.5rem;
      font-weight: 400;
      font-style: italic;
      margin-bottom: 2rem;
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    .gallery-title::before {
      content: "♦";
      font-size: 2.2rem;
      font-style: normal;
      color: #000;
      text-shadow: 0 0 2px rgba(255,255,255,0.2);
    }
    
    /* Carousel CSS */
    .carousel-container {
      position: relative;
      width: 100%;
      max-width: 1000px;
      margin: 0 auto;
      overflow: hidden;
      border-radius: 8px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.5);
      background: transparent;
    }
    .carousel-track {
      display: flex;
      transition: transform 0.4s ease-in-out;
    }
    .carousel-track img {
      width: 100%;
      flex-shrink: 0;
      object-fit: contain;
      background: transparent;
    }
    .carousel-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(0,0,0,0.5);
      color: white;
      border: none;
      padding: 1rem 1.5rem;
      cursor: pointer;
      font-size: 2rem;
      z-index: 10;
      transition: background 0.2s;
    }
    .carousel-btn:hover {
      background: rgba(0,0,0,0.9);
    }
    .prev-btn { left: 0; }
    .next-btn { right: 0; }

    /* Grid for additional photos */
    .photo-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 1.5rem;
      margin-top: 4rem;
    }
    .photo-grid img {
      width: 100%;
      height: 250px;
      object-fit: cover;
      border-radius: 8px;
      box-shadow: 0 8px 16px rgba(0,0,0,0.5);
      transition: transform 0.3s;
      cursor: pointer;
    }
    .photo-grid img:hover {
      transform: scale(1.03);
    }
    
    /* Lightbox */
    #lightbox {
      display: none;
      position: fixed;
      z-index: 10000;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0,0,0,0.9);
      justify-content: center;
      align-items: center;
      backdrop-filter: blur(5px);
    }
    #lightbox img {
      max-width: 90%;
      max-height: 90vh;
      border-radius: 8px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      object-fit: contain;
    }
    #lightbox .close-btn {
      position: absolute;
      top: 20px;
      right: 40px;
      color: white;
      font-size: 50px;
      font-weight: bold;
      cursor: pointer;
      user-select: none;
    }
    .lightbox-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      color: white;
      font-size: 60px;
      font-weight: bold;
      cursor: pointer;
      user-select: none;
      padding: 0 20px;
      transition: color 0.3s;
    }
    .lightbox-arrow:hover {
      color: #00e5ff;
    }
    .left-arrow {
      left: 20px;
    }
    .right-arrow {
      right: 20px;
    }
  </style>
</head>
<body>

    </div>
    
  </div>

  <!-- Lightbox Modal -->
  <div id="lightbox">
    <span class="close-btn" id="close-lightbox">&times;</span>
    <span class="lightbox-arrow left-arrow" id="prev-lightbox">&lsaquo;</span>
    <img id="lightbox-img" src="" alt="Fullscreen Image">
    <span class="lightbox-arrow right-arrow" id="next-lightbox">&rsaquo;</span>
  </div>
  <script>
    const track = document.getElementById('carousel-track');
    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');
    let index = 0;
    const totalImages = 4;

    function updateCarousel() {
      track.style.transform = `translateX(-${index * 100}%)`;
    }

    prevBtn.addEventListener('click', () => {
      index = (index - 1 + totalImages) % totalImages;
      updateCarousel();
    });

    nextBtn.addEventListener('click', () => {
      index = (index + 1) % totalImages;
      updateCarousel();
    });
    // Lightbox Functionality
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightbox-img');
    const closeLightbox = document.getElementById('close-lightbox');
    const prevLightbox = document.getElementById('prev-lightbox');
    const nextLightbox = document.getElementById('next-lightbox');
    const gridImages = document.querySelectorAll('.photo-grid img');
    let currentLightboxIndex = 0;

    gridImages.forEach((img, index) => {
      img.addEventListener('click', function() {
        currentLightboxIndex = index;
        lightbox.style.display = 'flex';
        lightboxImg.src = this.src;
        document.body.style.overflow = 'hidden';
      });
    });

    prevLightbox.addEventListener('click', (e) => {
      e.stopPropagation();
      currentLightboxIndex = (currentLightboxIndex - 1 + gridImages.length) % gridImages.length;
      lightboxImg.src = gridImages[currentLightboxIndex].src;
    });

    nextLightbox.addEventListener('click', (e) => {
      e.stopPropagation();
      currentLightboxIndex = (currentLightboxIndex + 1) % gridImages.length;
      lightboxImg.src = gridImages[currentLightboxIndex].src;
    });

    closeLightbox.addEventListener('click', () => {
      lightbox.style.display = 'none';
      document.body.style.overflow = 'auto';
    });

    lightbox.addEventListener('click', (e) => {
      if (e.target !== lightboxImg && e.target !== prevLightbox && e.target !== nextLightbox) {
        lightbox.style.display = 'none';
        document.body.style.overflow = 'auto';
      }
    });
  </script>
